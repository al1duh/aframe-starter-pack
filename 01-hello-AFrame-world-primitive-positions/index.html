<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-sphere position="-1 0.5 -3" rotation="0 45 0" color="#FFFFFF"></a-box>
      <a-sphere position="0 0.5 -3" rotation="0 45 0" color="#FFFFFF"></a-box>
       <a-box position="0.0000001 1.5 -3" rotation="0 45 0" color="#FFFFFF"></a-box>
      " rotation="0 45 0" color="#FFFFFF"></a-box>
      <a-sphere position="0 0.3 5" radius="1.15" color="#FFFFFF"></a-sphere>
      <a-sphere position="0 2 5" radius="1" color="#FFFFFF"></a-sphere>
      <a-sphere position="4 3.5 5" radius="0.75" color="#FFFFFF"></a-sphere>
      <a-sphere position="-3 0.3 5" radius="1.15" color="#FFFFFF"></a-sphere>
      <a-sphere position="0 2 5" radius="1" color="#FFFFFF"></a-sphere>
      <a-sphere position="2 2 5" radius="-2" color="#FFFFFF"></a-sphere>
      <!-- Snowman Body -->
<a-sphere position="0 0.8 -5" radius="1.2" color="#FFFFFF"></a-sphere>

<!-- Middle -->
<a-sphere position="0 2.3 -5" radius="0.9" color="#FFFFFF"></a-sphere>

<!-- Head -->
<a-sphere position="0 3.5 -5" radius="0.7" color="#FFFFFF"></a-sphere>

<!-- Eyes -->
<a-sphere position="-0.2 3.6 -4.35" radius="0.05" color="#000000"></a-sphere>
<a-sphere position="0.2 3.6 -4.35" radius="0.05" color="#000000"></a-sphere>

<!-- Orange Cone Nose -->
<a-cone 
    position="0 3.45 -4.25" 
    radius-bottom="0.05" 
    radius-top="0.0" 
    height="0.35" 
    rotation="90 0 0" 
    color="orange">
</a-cone>

      <
      <a-plane position="0 0.1 -4" rotation="-90 0 0" width="4" height="4" color="#FFFFFF"></a-plane>
      <!-- <a-sky color="#ECECEC"></a-sky> -->
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset: starry
      ; dressingAmount: 500"></a-entity>
    </a-scene>
  </body>
</html>

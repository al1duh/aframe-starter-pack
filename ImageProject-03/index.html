<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>

  <body>
    <a-scene>

      <!-- Sky Image -->
      <a-sky src="Assets/sky pro3.jpg" radius="50"></a-sky>

      <!-- Ground Plane -->
      <a-plane
        position="0 -1 0"
        rotation="-90 0 0"
        width="100"
        height="100"
        color="#1E90FF">
      </a-plane>

      <!-- Blue Cones -->
      <a-cone position="-8 0 -6" radius-bottom="0.5" radius-top="0" height="2" color="#4FC3F7"></a-cone>

      <a-cone position="-4 0 -10" radius-bottom="0.7" radius-top="0" height="3" color="#29B6F6"></a-cone>

      <a-cone position="0 0 -7" radius-bottom="0.6" radius-top="0" height="2.5" color="#03A9F4"></a-cone>

      <a-cone position="5 0 -12" radius-bottom="0.8" radius-top="0" height="3.5" color="#039BE5"></a-cone>

      <a-cone position="9 0 -8" radius-bottom="0.5" radius-top="0" height="2" color="#0288D1"></a-cone>

      <!-- Floating Blue Spheres -->
      <a-sphere position="-6 8 -10" radius="1" color="#81D4FA"></a-sphere>

      <a-sphere position="4 10 -15" radius="1.5" color="#4FC3F7"></a-sphere>

      <a-sphere position="10 6 -20" radius="1.2" color="#29B6F6"></a-sphere>

      <a-sphere position="-12 12 -25" radius="2" color="#03A9F4"></a-sphere>

      <a-sphere position="0 14 -18" radius="1.3" color="#B3E5FC"></a-sphere>

    </a-scene>
  </body>
</html>
